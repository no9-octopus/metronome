<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>メトロノーム</title>

  <style>
    #beats {
      display: flex;
      gap: 12px;
      margin: 16px 0;
    }
    .dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #ddd;
    }
    .dot.active {
      background: #e53935;
    }
  </style>

</head>
<body>
  <h1>メトロノーム</h1>

  <p><span id="bpm">120</span> BPM</p>

  <div id="beats">
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>

  <button id="down10">-</span> 10</button>
  <button id="down">−</button>
  <button id="up">＋</button>
  <button id="up10">＋</span> 10</button>
  <button id="reset">Reset</button>
  <p></p><button id="toggle">Start</button></p>

  <script>
    const DEFAULT_BPM = 120;
const MIN_BPM = 30;
const MAX_BPM = 240;
const BEATS_PER_BAR = 4;

const LOOKAHEAD_MS = 25;        // スケジューラを動かす間隔(ミリ秒)
const SCHEDULE_AHEAD_SEC = 0.1; // どれだけ先の拍まで予約するか(秒)

let bpm = DEFAULT_BPM;
let timerId = null;       // スケジューラのタイマー(停止中は null)
let audioContext = null;
let currentBeat = 0;      // 次に鳴らす拍の番号(0〜3)
let nextNoteTime = 0;     // 次の拍を鳴らす時刻(音声の時計の秒)

const bpmDisplay = document.getElementById("bpm");
const toggleButton = document.getElementById("toggle");
const dots = document.querySelectorAll(".dot");

function ensureAudioContext() {
  if (!audioContext) {
    audioContext = new AudioContext();
  }
  if (audioContext.state === "suspended") {
    audioContext.resume();
  }
}

// 指定した時刻にクリック音を鳴らすよう予約する
function playClick(time) {
  const osc = audioContext.createOscillator();
  const gain = audioContext.createGain();

  osc.frequency.value = 1000;
  gain.gain.setValueAtTime(1, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);

  osc.connect(gain);
  gain.connect(audioContext.destination);
  osc.start(time);
  osc.stop(time + 0.05);
}

// 指定した番号の丸だけを光らせる(-1なら全部消す)
function showBeat(index) {
  dots.forEach((dot, i) => {
    dot.classList.toggle("active", i === index);
  });
}

// 1拍ぶんの予約(音は予約、表示は時刻が来たら光らせる)
function scheduleNote(beat, time) {
  playClick(time);

  const delayMs = Math.max(0, (time - audioContext.currentTime) * 1000);
  setTimeout(() => {
    if (timerId !== null) {
      showBeat(beat);
    }
  }, delayMs);
}

// 次の拍へ進める
function advanceNote() {
  nextNoteTime += 60 / bpm;
  currentBeat = (currentBeat + 1) % BEATS_PER_BAR;
}

// 0.1秒先までに鳴らすべき拍を、すべて予約する
function scheduler() {
  while (nextNoteTime < audioContext.currentTime + SCHEDULE_AHEAD_SEC) {
    scheduleNote(currentBeat, nextNoteTime);
    advanceNote();
  }
}

function setBpm(value) {
  bpm = Math.min(MAX_BPM, Math.max(MIN_BPM, value));
  bpmDisplay.textContent = bpm;
}

function changeBpm(amount) {
  setBpm(bpm + amount);
}

function start() {
  ensureAudioContext();
  currentBeat = 0;
  nextNoteTime = audioContext.currentTime + 0.05; // 少しだけ余裕をもって開始
  timerId = setInterval(scheduler, LOOKAHEAD_MS);
  scheduler(); // 待たずに最初の予約を入れる
  toggleButton.textContent = "Stop";
}

function stop() {
  clearInterval(timerId);
  timerId = null;
  currentBeat = 0;
  showBeat(-1);
  toggleButton.textContent = "Start";
}

toggleButton.addEventListener("click", () => {
  if (timerId === null) {
    start();
  } else {
    stop();
  }
});

document.getElementById("up").addEventListener("click", () => changeBpm(1));
document.getElementById("down").addEventListener("click", () => changeBpm(-1));
document.getElementById("reset").addEventListener("click", () => setBpm(DEFAULT_BPM));

setBpm(DEFAULT_BPM);

    document.getElementById("up").addEventListener("click", () => changeBpm(1));
    document.getElementById("down").addEventListener("click", () => changeBpm(-1));
    document.getElementById("up10").addEventListener("click", () => changeBpm(10));
    document.getElementById("down10").addEventListener("click", () => changeBpm(-10));
    document.getElementById("reset").addEventListener("click", () => setBpm(DEFAULT_BPM));

    setBpm(DEFAULT_BPM);

  </script>
</body>
</html>

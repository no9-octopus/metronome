<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEtronome</title>
  
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f5f7;
      color: #222;
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    }

    .metronome {
      width: min(90vw, 360px);
      padding: 32px 24px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 1.2rem;
      color: #555;
    }

    .bpm-display {
      margin: 0;
    }

    #bpm {
      font-size: 4.5rem;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .unit {
      margin-left: 8px;
      color: #888;
    }

    .tempo-controls {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin: 20px 0;
    }

    button {
      font: inherit;
      border: none;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:focus-visible {
      outline: 3px solid #90caf9;
      outline-offset: 2px;
    }

    .round {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #eceff1;
      font-size: 1.6rem;
    }

    .round:active {
      background: #cfd8dc;
    }

    #beats {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 8px 0 32px;
    }

    .dot {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #e0e0e0;
      transition: background 0.08s, transform 0.08s;
    }

    .dot.active {
      background: #e53935;
      transform: scale(1.25);
    }

    .primary {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      background: #1976d2;
      color: #fff;
      font-size: 1.2rem;
      font-weight: 600;
    }

    .primary:active {
      background: #1565c0;
    }

    .primary.running {
      background: #455a64;
    }

    .text {
      margin-top: 12px;
      padding: 8px 16px;
      background: none;
      color: #777;
    }
  </style>
</head>
<body>
  <main class="metronome">
    <h1>MEtronome</h1>

    <div id="beats">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <p class="bpm-display">
      <span id="bpm">120</span><span class="unit">BPM</span>
    </p>

    <div class="tempo-controls">
      <button id="down10" class="round" aria-label="テンポを10下げる">−10</button>
      <button id="down" class="round" aria-label="テンポを下げる">−</button>
      <button id="up" class="round" aria-label="テンポを上げる">＋</button>
      <button id="up10" class="round" aria-label="テンポを10上げる">＋10</button>
    </div>

    <button id="toggle" class="primary">Start</button>
    <button id="reset" class="text">Reset</button>
  </main>

  <script>
    const DEFAULT_BPM = 120;
const MIN_BPM = 30;
const MAX_BPM = 240;
const BEATS_PER_BAR = 4;

const LOOKAHEAD_MS = 25;        // スケジューラを動かす間隔(ミリ秒)
const SCHEDULE_AHEAD_SEC = 0.1; // どれだけ先の拍まで予約するか(秒)

let bpm = DEFAULT_BPM;
let timerId = null;       // スケジューラのタイマー(停止中は null)
let audioContext = null;
let currentBeat = 0;      // 次に鳴らす拍の番号(0〜3)
let nextNoteTime = 0;     // 次の拍を鳴らす時刻(音声の時計の秒)

const bpmDisplay = document.getElementById("bpm");
const toggleButton = document.getElementById("toggle");
const dots = document.querySelectorAll(".dot");

function ensureAudioContext() {
  if (!audioContext) {
    audioContext = new AudioContext();
  }
  if (audioContext.state === "suspended") {
    audioContext.resume();
  }
}

// 指定した時刻にクリック音を鳴らすよう予約する
function playClick(time) {
  const osc = audioContext.createOscillator();
  const gain = audioContext.createGain();

  osc.frequency.value = 1000;
  gain.gain.setValueAtTime(1, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);

  osc.connect(gain);
  gain.connect(audioContext.destination);
  osc.start(time);
  osc.stop(time + 0.05);
}

// 指定した番号の丸だけを光らせる(-1なら全部消す)
function showBeat(index) {
  dots.forEach((dot, i) => {
    dot.classList.toggle("active", i === index);
  });
}

// 1拍ぶんの予約(音は予約、表示は時刻が来たら光らせる)
function scheduleNote(beat, time) {
  playClick(time);

  const delayMs = Math.max(0, (time - audioContext.currentTime) * 1000);
  setTimeout(() => {
    if (timerId !== null) {
      showBeat(beat);
    }
  }, delayMs);
}

// 次の拍へ進める
function advanceNote() {
  nextNoteTime += 60 / bpm;
  currentBeat = (currentBeat + 1) % BEATS_PER_BAR;
}

// 0.1秒先までに鳴らすべき拍を、すべて予約する
function scheduler() {
  while (nextNoteTime < audioContext.currentTime + SCHEDULE_AHEAD_SEC) {
    scheduleNote(currentBeat, nextNoteTime);
    advanceNote();
  }
}

function setBpm(value) {
  bpm = Math.min(MAX_BPM, Math.max(MIN_BPM, value));
  bpmDisplay.textContent = bpm;
}

function changeBpm(amount) {
  setBpm(bpm + amount);
}

function start() {
  ensureAudioContext();
  currentBeat = 0;
  nextNoteTime = audioContext.currentTime + 0.05; // 少しだけ余裕をもって開始
  timerId = setInterval(scheduler, LOOKAHEAD_MS);
  scheduler(); // 待たずに最初の予約を入れる
  toggleButton.textContent = "Stop";
  toggleButton.classList.add("running");
}

function stop() {
  clearInterval(timerId);
  timerId = null;
  currentBeat = 0;
  showBeat(-1);
  toggleButton.textContent = "Start";
  toggleButton.classList.remove("running");
}

toggleButton.addEventListener("click", () => {
  if (timerId === null) {
    start();
  } else {
    stop();
  }
});

document.getElementById("up").addEventListener("click", () => changeBpm(1));
document.getElementById("down").addEventListener("click", () => changeBpm(-1));
document.getElementById("reset").addEventListener("click", () => setBpm(DEFAULT_BPM));

setBpm(DEFAULT_BPM);

    document.getElementById("up").addEventListener("click", () => changeBpm(1));
    document.getElementById("down").addEventListener("click", () => changeBpm(-1));
    document.getElementById("up10").addEventListener("click", () => changeBpm(10));
    document.getElementById("down10").addEventListener("click", () => changeBpm(-10));
    document.getElementById("reset").addEventListener("click", () => setBpm(DEFAULT_BPM));

    setBpm(DEFAULT_BPM);

  </script>
</body>
</html>
